#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/nginx.conf

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# These two machine routes use a dedicated visitors permission, but the
# application ALWAYS requires its own scoped Bearer credential.
location = __PATH__/mcp {
    proxy_pass http://127.0.0.1:__PORT__/mcp;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Report-Admin "";
    proxy_set_header Remote-User "";
    proxy_set_header Auth-User "";
    client_max_body_size 100k;
}

location __PATH__/api/integrations/v1/ {
    proxy_pass http://127.0.0.1:__PORT__/api/integrations/v1/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Report-Admin "";
    proxy_set_header Remote-User "";
    proxy_set_header Auth-User "";
    client_max_body_size 100k;
}

# Permission admins, separate from main. Never trust a browser-supplied role.
location = __PATH__/integrations.html {
    proxy_pass http://127.0.0.1:__PORT__/integrations.html;
    proxy_set_header Remote-User $http_ynh_user;
    proxy_set_header X-Report-Admin "1";
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
}

location __PATH__/api/v1/integrations {
    proxy_pass http://127.0.0.1:__PORT__/api/v1/integrations;
    proxy_set_header Remote-User $http_ynh_user;
    proxy_set_header X-Report-Admin "1";
    client_max_body_size 100k;
}

location __PATH__/api/ {
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_set_header Host $host;
    proxy_set_header Remote-User $http_ynh_user;
    proxy_set_header Auth-User $http_ynh_user;
    proxy_set_header X-Report-Admin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
}

location __PATH__/ {
    alias __INSTALL_DIR__/web/;
    index index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
